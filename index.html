<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Motion Pro | Kling Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js"></script>
    <style>
        body { background: #050507; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .kling-gradient { background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%); }
        .loader { border-top-color: #8b5cf6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .preview-box { border: 2px dashed #2d2d35; transition: all 0.3s; }
        .preview-box:hover { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.05); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 kling-gradient rounded-xl flex items-center justify-center shadow-lg shadow-purple-500/20">
                    <span class="text-2xl font-black">K</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tighter text-white">MOTION <span class="text-purple-500 text-sm font-mono tracking-normal uppercase">Control v2.1</span></h1>
                    <p class="text-xs text-gray-500">Full Body Motion Transfer Technology</p>
                </div>
            </div>
            <div class="hidden md:block bg-gray-900 px-4 py-1.5 rounded-full border border-gray-800 text-xs font-mono text-green-400">
                ● Server Status: Active (H100 Free Tier)
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="glass p-6 rounded-[2rem] shadow-2xl">
                    <h3 class="text-sm font-semibold mb-6 flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-purple-500 rounded-full"></span> Настройки генерации
                    </h3>

                    <div class="mb-6">
                        <label class="block text-xs uppercase text-gray-500 font-bold mb-3 tracking-widest">1. Персонаж (Фото)</label>
                        <div onclick="document.getElementById('imageInput').click()" class="preview-box rounded-2xl p-4 text-center cursor-pointer relative overflow-hidden h-40 flex flex-col items-center justify-center">
                            <input type="file" id="imageInput" accept="image/*" class="hidden">
                            <img id="imgPreview" class="absolute inset-0 w-full h-full object-cover hidden">
                            <div id="imgPlaceholder">
                                <svg class="w-8 h-8 text-gray-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <span class="text-xs text-gray-500 uppercase tracking-tighter">Выбрать фото</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-8">
                        <label class="block text-xs uppercase text-gray-500 font-bold mb-3 tracking-widest">2. Движения (Видео)</label>
                        <div onclick="document.getElementById('videoInput').click()" class="preview-box rounded-2xl p-4 text-center cursor-pointer relative overflow-hidden h-40 flex flex-col items-center justify-center">
                            <input type="file" id="videoInput" accept="video/*" class="hidden">
                            <video id="vidPreview" class="absolute inset-0 w-full h-full object-cover hidden" muted loop></video>
                            <div id="vidPlaceholder">
                                <svg class="w-8 h-8 text-gray-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                <span class="text-xs text-gray-500 uppercase tracking-tighter">Загрузить жест</span>
                            </div>
                        </div>
                    </div>

                    <button id="startBtn" class="w-full py-4 rounded-xl kling-gradient text-white font-bold text-sm tracking-widest uppercase hover:opacity-90 transition-all transform hover:scale-[1.01] active:scale-95 shadow-lg shadow-purple-500/20">
                        Оживить персонажа
                    </button>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="glass rounded-[2rem] h-full min-h-[500px] flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="loadingState" class="hidden flex flex-col items-center z-10 p-10 text-center">
                        <div class="loader w-16 h-16 border-4 border-gray-800 rounded-full mb-6"></div>
                        <h2 class="text-xl font-bold mb-2">Нейросеть MimicMotion работает...</h2>
                        <p class="text-gray-500 text-sm max-w-xs">Это может занять от 1 до 5 минут в зависимости от длины видео и очереди.</p>
                    </div>
                    
                    <div id="placeholder" class="text-center opacity-30">
                        <div class="w-24 h-24 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-10 h-10 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <p class="text-sm tracking-widest uppercase">Ожидание данных</p>
                    </div>

                    <video id="finalVideo" class="hidden w-full h-full object-contain" controls autoplay loop></video>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

        const imageInput = document.getElementById('imageInput');
        const videoInput = document.getElementById('videoInput');
        const startBtn = document.getElementById('startBtn');
        const finalVideo = document.getElementById('finalVideo');
        const loadingState = document.getElementById('loadingState');
        const placeholder = document.getElementById('placeholder');

        // Обработка превью фото
        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('imgPreview').src = URL.createObjectURL(file);
                document.getElementById('imgPreview').classList.remove('hidden');
                document.getElementById('imgPlaceholder').classList.add('hidden');
            }
        };

        // Обработка превью видео
        videoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('vidPreview').src = URL.createObjectURL(file);
                document.getElementById('vidPreview').classList.remove('hidden');
                document.getElementById('vidPlaceholder').classList.add('hidden');
                document.getElementById('vidPreview').play();
            }
        };

        // Основная функция генерации
        startBtn.onclick = async () => {
            if (!imageInput.files[0] || !videoInput.files[0]) {
                alert("Ошибка: Нужно загрузить и фотографию, и видео с движениями.");
                return;
            }

            // UI Состояние: Загрузка
            placeholder.classList.add('hidden');
            loadingState.classList.remove('hidden');
            finalVideo.classList.add('hidden');
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // Подключение к API модели MimicMotion
                const app = await Client.connect("fudan-generative-ai/MimicMotion");
                
                // Выполнение запроса
                const result = await app.predict("/predict", [
                    handle_file(imageInput.files[0]), 
                    handle_file(videoInput.files[0]), 
                    16,   // frames (короткое превью для скорости)
                    512,  // resolution
                    2,    // overlap
                    20    // steps
                ]);

                // Визуализация результата
                if (result.data && result.data[0]) {
                    const videoUrl = result.data[0].url;
                    finalVideo.src = videoUrl;
                    finalVideo.classList.remove('hidden');
                    loadingState.classList.add('hidden');
                }
            } catch (error) {
                console.error("API Error:", error);
                alert("Сервер перегружен. Попробуйте еще раз через минуту.");
                loadingState.classList.add('hidden');
                placeholder.classList.remove('hidden');
            } finally {
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        };
    </script>
</body>
</html>
